<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camond Centre</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg"/>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        -webkit-app-region: drag;
      }
      button, input, textarea, select, a, [role="button"] {
        -webkit-app-region: no-drag;
      }
      /* Interactive surfaces opt out of the window-drag region so their
         click/drag handlers (task rows, news items, timeline scroll/resize,
         tile reorder handles, overlay backdrops) aren't swallowed by macOS
         window dragging. The grid gaps/padding stay draggable to move the
         window. */
      .no-drag {
        -webkit-app-region: no-drag;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
